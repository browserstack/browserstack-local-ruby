name: Ruby Gem

on: workflow_dispatch

jobs:
  build:
    name: Build + Publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write

    steps:
    - uses: actions/checkout@v3
    - name: Set up Ruby 2.6
      uses: ruby/setup-ruby@v1
      with:
        ruby-version: 2.6.10

    - uses: rubygems/configure-rubygems-credentials@v2.0.0
    - name: Build and push gem
      run: |
        gem build *.gemspec
        gem push *.gem
      shell: bash
